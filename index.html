<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Lua Maggia | Sesiones</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Montserrat:wght@300;400;500;600&display=swap"
    rel="stylesheet"
  >

  <style>

    :root {
      --bg-color: #eee8ef;
      --card-bg: #faf8fa;
      --border: #c8b8ca;
      --text: #4a414b;
      --soft: #756b76;
      --accent: #9b829f;
      --gold: #b69b69;
      --shadow: rgba(75,60,80,0.12);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background:
        radial-gradient(
          circle at top,
          rgba(255,255,255,0.7),
          transparent 45%
        ),
        var(--bg-color);

      font-family: 'Montserrat', sans-serif;
      color: var(--text);

      min-height: 100vh;

      padding: 45px 20px;
    }

    .container {
      width: 100%;
      max-width: 480px;
      margin: auto;
      text-align: center;
    }

    /* PERFIL */

    .profile-img {
      width: 105px;
      height: 105px;

      border-radius: 50%;

      object-fit: cover;

      border: 2px solid var(--border);

      margin-bottom: 18px;

      box-shadow:
        0 6px 18px var(--shadow);
    }

    .title {
      font-family: 'Cormorant Garamond', serif;

      font-size: 2.5rem;

      font-weight: 500;

      margin-bottom: 5px;
    }

    .subtitle {
      font-size: 0.75rem;

      text-transform: uppercase;

      letter-spacing: 2px;

      color: var(--accent);

      margin-bottom: 12px;
    }

    .description {
      font-family: 'Cormorant Garamond', serif;

      font-size: 1.15rem;

      line-height: 1.5;

      color: var(--soft);

      max-width: 360px;

      margin: 0 auto 32px;
    }

    /* LINKS */

    .links-container {
      display: flex;

      flex-direction: column;

      gap: 14px;
    }

    .link-card {
      display: flex;

      align-items: center;

      justify-content: space-between;

      background: var(--card-bg);

      border: 1px solid var(--border);

      border-radius: 25px;

      padding: 17px 20px;

      text-decoration: none;

      color: var(--text);

      font-size: 0.9rem;

      font-weight: 500;

      box-shadow:
        0 5px 14px var(--shadow);

      transition: all 0.25s ease;
    }

    .link-card:hover {
      transform: translateY(-3px);

      background: #ffffff;

      box-shadow:
        0 9px 20px var(--shadow);
    }

    .icon {
      width: 30px;

      text-align: left;

      font-size: 1.2rem;
    }

    .text {
      flex-grow: 1;

      text-align: center;

      padding: 0 8px;
    }

    .dots {
      width: 30px;

      text-align: right;

      opacity: 0.35;
    }

    .separator {
      margin: 25px 0 12px;

      display: flex;

      align-items: center;

      gap: 12px;

      color: var(--gold);

      font-size: 0.7rem;

      letter-spacing: 2px;
    }

    .separator::before,
    .separator::after {
      content: "";

      flex: 1;

      height: 1px;

      background: rgba(182,155,105,0.35);
    }

    .footer {
      margin-top: 30px;

      font-size: 0.68rem;

      letter-spacing: 1px;

      color: var(--soft);

      opacity: 0.7;
    }

    @media (max-width: 480px) {

      body {
        padding: 35px 17px;
      }

      .profile-img {
        width: 95px;
        height: 95px;
      }

      .title {
        font-size: 2.2rem;
      }

    }

  </style>
</head>

<body>

  <div class="container">

    <!-- FOTO -->
    <img
      class="profile-img"
      src="logo.png"
      alt="Lua Maggia"
    >

    <!-- NOMBRE -->
    <h1 class="title">
      Lua Maggia
    </h1>

    <p class="subtitle">
      Tarot · Reiki · Energía
    </p>

    <p class="description">
      Un espacio para conectar, comprender
      y volver a vos.
    </p>


    <!-- SESIONES -->

    <div class="links-container" id="sesiones">

      <a href="tarot.html" class="link-card">


        <span class="text">
          Tarot
        </span>

        <span class="dots">⋮</span>

      </a>


      <a href="reiki.html" class="link-card">


        <span class="text">
          Reiki & Limpieza Energética
        </span>

        <span class="dots">⋮</span>

      </a>


      <a href="constelaciones.html" class="link-card">


        <span class="text">
          Constelaciones Familiares
        </span>

        <span class="dots">⋮</span>

      </a>


      <a href="mediumnidad.html" class="link-card">


        <span class="text">
          Sesiones de Mediumnidad
        </span>

        <span class="dots">⋮</span>

      </a>


      <div class="separator">
        CONTACTO
      </div>


      <a
        href="+5493364523938"
        class="link-card"
        target="_blank"
      >

        <span class="icon">💬</span>

        <span class="text">
          Consultar por WhatsApp
        </span>

        <span class="dots">⋮</span>

      </a>


      <!-- CAMBIAR POR EL INSTAGRAM REAL -->

      <a
        href="#"
        class="link-card"
        target="_blank"
      >

        <span class="icon">◎</span>

        <span class="text">
          Instagram
        </span>

        <span class="dots">⋮</span>

      </a>

    </div>


    <div class="footer">
      LUA MAGGIA · SESIONES ONLINE
    </div>

  </div>

</body>
</html>
